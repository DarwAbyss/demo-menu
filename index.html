<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando...</title>

  <!-- ============================================ -->
  <!-- ETIQUETAS OPEN GRAPH PARA WHATSAPP / REDES   -->
  <!-- ============================================ -->
  <meta property="og:title" content="Vista Previa de tu Próxima Página Web" />
  <meta property="og:description" content="Haz clic para probar la demo interactiva y ver cómo recibir pedidos directamente por WhatsApp." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Klovia Web Solutions" />

  <!-- Tipografías: Poppins para títulos, Inter para texto -->
  <link rel="preconnect" href="https://fonts.googleapis">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- CDN de Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui"],
            display: ["Poppins", "ui-sans-serif", "system-ui"]
          },
          colors: {
            cream: "#FAF6EF",
            ink: "#2B2118"
          }
        }
      }
    };
  </script>

  <style>
    #contenedor-categorias::-webkit-scrollbar { display: none; }
    #contenedor-categorias { scrollbar-width: none; }
  </style>
</head>

<body class="bg-cream text-ink font-sans">

  <main>
    <!-- ==================== ENCABEZADO / HERO CON FOTO ==================== -->
    <header class="relative">
      <div class="relative h-64 w-full sm:h-80 lg:h-[380px]">
        <img id="hero-imagen" src="" alt="" class="h-full w-full object-cover" />
        <div class="absolute inset-0 bg-gradient-to-t from-cream via-cream/60 to-cream/10"></div>
      </div>

      <div class="mx-auto -mt-16 max-w-3xl px-4 sm:-mt-20 lg:-mt-24 lg:max-w-5xl">
        <div class="rounded-2xl border border-black/5 bg-white/90 p-6 text-center shadow-sm backdrop-blur sm:p-8">
          <img id="nav-logo" src="" alt="Logo" class="mx-auto mb-3 h-14 w-14 rounded-xl object-contain hidden" onerror="this.classList.add('hidden')" />
          <p id="header-subtitulo" class="font-display text-xs font-semibold uppercase tracking-[0.2em] text-amber-700"></p>
          <h1 id="header-nombre" class="mt-2 font-display text-4xl font-bold tracking-tight text-ink sm:text-5xl"></h1>
          <p id="header-slogan" class="mx-auto mt-3 max-w-xl text-sm leading-relaxed text-ink/70"></p>
        </div>
      </div>

      <div class="mx-auto mt-4 max-w-3xl px-4 lg:max-w-5xl">
        <div id="banner-delivery" class="rounded-full border border-amber-700/15 bg-amber-50 px-5 py-2.5 text-center text-xs font-medium text-amber-800 sm:text-sm"></div>
      </div>
    </header>

    <div class="mx-auto max-w-3xl px-4 lg:max-w-6xl">
      <!-- NAVEGACIÓN DE CATEGORÍAS (PESTAÑAS) -->
      <nav class="sticky top-0 z-20 -mx-4 mt-6 flex gap-2 overflow-x-auto border-b border-black/5 bg-cream/90 px-4 py-3 backdrop-blur">
        <div id="contenedor-categorias" class="flex gap-2"></div>
      </nav>

      <!-- LISTA DE PRODUCTOS -->
      <div id="contenedor-productos" class="grid gap-4 py-6 sm:grid-cols-2 lg:grid-cols-3"></div>
    </div>

    <!-- ==================== SECCIÓN SOBRE NOSOTROS ==================== -->
    <section class="mx-auto max-w-3xl px-4 mb-12 rounded-2xl border border-black/5 bg-white p-6 sm:p-8 lg:p-10 lg:max-w-6xl lg:mb-16">
      <div class="grid gap-6 md:grid-cols-12 md:items-center">
        <div class="h-48 overflow-hidden rounded-xl bg-black/5 md:col-span-5 md:h-full">
          <img id="nosotros-imagen" src="" alt="Sobre nosotros" class="h-full w-full object-cover" />
        </div>

        <div class="space-y-3 md:col-span-7">
          <span id="nosotros-subtitulo" class="block font-display text-xs font-semibold uppercase tracking-[0.2em] text-amber-700"></span>
          <h2 id="nosotros-titulo" class="font-display text-2xl font-bold text-ink"></h2>
          <p id="nosotros-descripcion" class="text-sm leading-relaxed text-ink/70"></p>
          <ul id="nosotros-caracteristicas" class="space-y-2 pt-2 text-sm font-medium text-ink/80"></ul>
        </div>
      </div>
    </section>

    <!-- ==================== SECCIÓN MAPA Y UBICACIÓN ==================== -->
    <section class="mx-auto max-w-3xl px-4 mb-12 rounded-2xl border border-black/5 bg-white p-6 sm:p-8 lg:p-10 lg:max-w-6xl lg:mb-16">
      <div class="mx-auto mb-6 max-w-xl text-center">
        <span class="mb-1 block font-display text-xs font-semibold uppercase tracking-[0.2em] text-amber-700">Visítanos</span>
        <h2 class="font-display text-2xl font-bold text-ink">Nuestra Ubicación</h2>
        <p id="mapa-direccion-texto" class="mt-1 text-sm text-ink/60"></p>
      </div>

      <div class="relative h-64 w-full overflow-hidden rounded-xl border border-black/5 bg-black/5 sm:h-80 lg:h-96">
        <iframe id="mapa-iframe" class="h-full w-full border-0" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade" src=""></iframe>
      </div>

      <div class="mt-4 text-center">
        <a id="mapa-btn-enlace" href="#" target="_blank" class="inline-flex items-center gap-2 rounded-full border border-black/10 bg-cream px-5 py-2.5 text-xs font-semibold text-ink/80 transition hover:border-amber-700/30 hover:text-amber-700">
          Abrir en Google Maps
        </a>
      </div>
    </section>
  </main>

  <!-- ==================== PIE DE PÁGINA ==================== -->
  <footer class="border-t border-black/5 bg-white py-8 px-4 text-center text-xs text-ink/60">
    <div class="mx-auto max-w-md space-y-2">
      <p id="footer-ubicacion" class="font-medium text-ink/80"></p>
      <p id="footer-horario" class="text-ink/50"></p>
      <div class="mt-4 border-t border-black/5 pt-4 text-ink/40">
        &copy; <span id="footer-year"></span> <span id="footer-nombre"></span> — Desarrollado con Klovia Web Solutions
      </div>
    </div>
  </footer>

  <!-- Datos del negocio -->
  <script src="js/data.js"></script>

  <!-- Lógica de renderizado -->
  <script>
    function formatPrecio(precio) {
      return `${negocioData.moneda}${precio.toLocaleString("es-MX")}`;
    }

    // 1. Encabezado y pie de página
    document.title = negocioData.nombre;
    document.getElementById("header-nombre").innerText = negocioData.nombre;
    document.getElementById("header-subtitulo").innerText = negocioData.nosotros?.subtitulo || "";
    document.getElementById("header-slogan").innerText = negocioData.slogan;
    document.getElementById("footer-nombre").innerText = negocioData.nombre;
    document.getElementById("footer-year").innerText = new Date().getFullYear();
    document.getElementById("footer-ubicacion").innerText = `Ubicación: ${negocioData.contacto.ubicacion}`;
    document.getElementById("footer-horario").innerText = `Horario: ${negocioData.contacto.horario}`;
    document.getElementById("banner-delivery").innerText = negocioData.contacto.notaDelivery;
    document.getElementById("hero-imagen").src = negocioData.heroImagen || negocioData.nosotros?.imagen || "";
    document.getElementById("hero-imagen").alt = `Platillos de ${negocioData.nombre}`;

    if (negocioData.logo) {
      const imgLogo = document.getElementById("nav-logo");
      imgLogo.src = negocioData.logo;
      imgLogo.classList.remove("hidden");
    }

    // 2. Botones de categorías
    const contCat = document.getElementById("contenedor-categorias");
    negocioData.categorias.forEach((cat, index) => {
      const btn = document.createElement("button");
      btn.innerText = cat.nombre;
      btn.id = `btn-cat-${cat.id}`;
      btn.onclick = () => filtrarProductos(cat.id);
      btn.className = claseBotonCategoria(index === 0);
      contCat.appendChild(btn);
    });

    function claseBotonCategoria(activo) {
      return `shrink-0 rounded-full border px-4 py-1.5 text-sm font-medium transition-colors whitespace-nowrap ${
        activo
          ? `border-transparent text-white ${negocioData.colores.primario}`
          : "border-black/10 bg-white text-ink/60 hover:text-ink"
      }`;
    }

    // 3. Tarjetas de productos
    function renderizarProductos(lista) {
      const contProd = document.getElementById("contenedor-productos");
      contProd.innerHTML = "";

      lista.forEach((p) => {
        const msg = encodeURIComponent(`¡Hola! Vi su página web y me gustaría recibir más información sobre ${p.nombre}.`);
        const waLink = `https://wa.me/${negocioData.whatsapp}?text=${msg}`;

        contProd.innerHTML += `
          <article class="flex gap-4 rounded-xl border border-black/5 bg-white p-3.5 transition-colors hover:border-amber-700/30 sm:p-4 lg:p-5">
            <div class="h-20 w-20 shrink-0 overflow-hidden rounded-lg bg-black/5 sm:h-24 sm:w-24 lg:h-28 lg:w-28">
              <img src="${p.imagen}" alt="${p.nombre}" class="h-full w-full object-cover" />
            </div>

            <div class="flex min-w-0 flex-1 flex-col">
              <div class="flex items-baseline justify-between gap-3">
                <h3 class="font-display text-base font-semibold leading-tight text-ink">${p.nombre}</h3>
                <span class="shrink-0 font-display text-base font-semibold ${negocioData.colores.texto}">${formatPrecio(p.precio)}</span>
              </div>

              <p class="mt-1 text-sm leading-relaxed text-ink/60 line-clamp-2">${p.descripcion}</p>

              <div class="mt-2 flex items-center justify-between gap-2">
                ${p.popular ? `<span class="rounded-full px-2.5 py-0.5 text-xs font-medium ${negocioData.colores.badge}">Popular</span>` : ""}
                <a href="${waLink}" target="_blank" aria-label="Pedir ${p.nombre}" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-white transition ${negocioData.colores.primario} ${negocioData.colores.hover}">
                  <svg class="h-4 w-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                </a>
              </div>
            </div>
          </article>
        `;
      });
    }

    // 4. Filtrado por categoría
    function filtrarProductos(categoriaId) {
      negocioData.categorias.forEach((cat) => {
        const btn = document.getElementById(`btn-cat-${cat.id}`);
        btn.className = claseBotonCategoria(cat.id === categoriaId);
      });

      const filtrados =
        categoriaId === "todos"
          ? negocioData.productos
          : negocioData.productos.filter((p) => p.categoria === categoriaId);

      renderizarProductos(filtrados);
    }

    renderizarProductos(negocioData.productos);

    // 5. Sección "Sobre nosotros"
    document.getElementById("nosotros-subtitulo").innerText = negocioData.nosotros.subtitulo;
    document.getElementById("nosotros-titulo").innerText = negocioData.nosotros.titulo;
    document.getElementById("nosotros-descripcion").innerText = negocioData.nosotros.descripcion;
    document.getElementById("nosotros-imagen").src = negocioData.nosotros.imagen;
    document.getElementById("nosotros-imagen").alt = negocioData.nosotros.titulo;

    const contCarac = document.getElementById("nosotros-caracteristicas");
    negocioData.nosotros.caracteristicas.forEach((item) => {
      contCarac.innerHTML += `
        <li class="flex items-start gap-2">
          <svg class="mt-0.5 h-4 w-4 shrink-0 ${negocioData.colores.texto}" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M16.704 5.29a1 1 0 010 1.415l-7.005 7.005a1 1 0 01-1.414 0L3.296 8.72a1 1 0 111.414-1.414l4.284 4.284 6.296-6.296a1 1 0 011.414 0z" clip-rule="evenodd" />
          </svg>
          <span>${item}</span>
        </li>
      `;
    });

    // 6. Mapa de ubicación
    const direccion = negocioData.contacto.ubicacion;
    if (direccion) {
      document.getElementById("mapa-direccion-texto").innerText = direccion;
      const direccionCodificada = encodeURIComponent(direccion);
      document.getElementById("mapa-iframe").src = `https://maps.google.com/maps?q=${direccionCodificada}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
      document.getElementById("mapa-btn-enlace").href = `https://www.google.com/maps/search/?api=1&query=${direccionCodificada}`;
    }
  </script>
</body>
</html>
